<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>广告屏蔽助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: white;
      overflow: hidden;
    }

    .header {
      text-align: center;
      padding: 40px 20px 20px;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .header p {
      opacity: 0.9;
      font-size: 14px;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .status-card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      width: 400px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .status-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    .status-text {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .blocked-count {
      font-size: 48px;
      font-weight: bold;
      margin: 20px 0;
      color: #ffd700;
    }

    .blocked-label {
      font-size: 14px;
      opacity: 0.9;
    }

    .toggle-button {
      margin-top: 30px;
      padding: 15px 50px;
      font-size: 18px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
    }

    .toggle-button.active {
      background: white;
      color: #667eea;
    }

    .toggle-button.inactive {
      background: #ff6b6b;
      color: white;
    }

    .toggle-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
    }

    .message {
      margin-top: 20px;
      padding: 10px 20px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.2);
      font-size: 14px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛡️ 广告屏蔽助手</h1>
    <p>让您的浏览体验更清爽</p>
  </div>

  <div class="main-content">
    <div class="status-card">
      <div class="status-icon" id="statusIcon">🛡️</div>
      <div class="status-text" id="statusText">广告屏蔽已禁用</div>
      <div class="blocked-count" id="blockedCount">0</div>
      <div class="blocked-label">已屏蔽广告域名</div>
      <button class="toggle-button inactive" id="toggleBtn">启用屏蔽</button>
      <div class="message" id="message">点击按钮启用广告屏蔽</div>
    </div>
  </div>

  <div class="footer">
    通过修改系统hosts文件屏蔽广告域名
  </div>

  <script src="renderer.js"></script>
</body>
</html>
